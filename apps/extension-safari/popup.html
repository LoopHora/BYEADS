<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BYEADS</title>
  <style>
    :root {
      --bg-dark: #000000;
      --card-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(18, 24, 38, 0.45) 50%, rgba(10, 14, 22, 0.85) 100%);
      --card-border: rgba(255, 255, 255, 0.13);
      --card-shine: inset 0 1px 1px 0 rgba(255, 255, 255, 0.35);
      --text-white: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.65);
      --text-dim: rgba(255, 255, 255, 0.4);
      --brand: #f97316;
      --brand-glow: rgba(249, 115, 22, 0.85);
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.85);
      --cyan: #06b6d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 340px;
      height: 520px;
      overflow: hidden;
      background: #000000;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      color: var(--text-white);
      user-select: none;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px 12px;
    }

    /* Outer Header / Breadcrumb */
    .top-meta {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      font-size: 0.6875rem;
      font-weight: 500;
      color: var(--text-dim);
      letter-spacing: -0.01em;
    }

    .brand-id {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .brand-logo-mini {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      object-fit: contain;
    }

    .header-link {
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.2s ease;
      cursor: pointer;
    }

    .header-link:hover {
      color: var(--brand);
    }

    /* Signature Glassmorphic Squircle Card (Figma Style) */
    .glass-card {
      position: relative;
      width: 100%;
      height: 440px;
      border-radius: 38px;
      background: var(--card-bg);
      backdrop-filter: blur(45px) saturate(190%);
      -webkit-backdrop-filter: blur(45px) saturate(190%);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shine), 0 24px 60px rgba(0, 0, 0, 0.95);
      padding: 22px 20px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      transition: border-color 0.3s ease;
    }

    /* Ambient Bottom Glow Light (The signature visual element) */
    .card-ambient-glow {
      position: absolute;
      bottom: -45px;
      left: 8%;
      right: 8%;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--green-glow) 0%, rgba(249, 115, 22, 0.7) 45%, transparent 75%);
      filter: blur(34px);
      opacity: 0.85;
      pointer-events: none;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
    }

    .glass-card.disabled .card-ambient-glow {
      background: radial-gradient(circle, rgba(100, 116, 139, 0.4) 0%, transparent 70%);
      opacity: 0.35;
      filter: blur(40px);
    }

    .glass-card.whitelisted .card-ambient-glow {
      background: radial-gradient(circle, rgba(245, 158, 11, 0.85) 0%, rgba(239, 68, 68, 0.4) 50%, transparent 75%);
    }

    /* Card Top Bar */
    .card-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }

    .card-sync-text {
      font-size: 0.6875rem;
      font-weight: 500;
      color: var(--text-dim);
    }

    /* Frosted Capsule Button */
    .site-filter-capsule {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
      font-size: 0.6875rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      max-width: 140px;
      transition: all 0.2s ease;
    }

    .site-filter-capsule:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.22);
      color: var(--text-white);
    }

    .site-filter-capsule span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .site-filter-capsule svg {
      width: 10px;
      height: 10px;
      flex-shrink: 0;
      color: var(--text-dim);
    }

    /* Center Neon Curve Graphic Section */
    .chart-section {
      position: relative;
      width: 100%;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      margin: 10px 0 2px;
      cursor: pointer;
    }

    .neon-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .neon-curve {
      fill: none;
      stroke: var(--green);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 10px var(--green-glow)) drop-shadow(0 0 2px #ffffff);
      transition: stroke 0.4s ease, filter 0.4s ease;
    }

    .glass-card.disabled .neon-curve {
      stroke: #475569;
      filter: drop-shadow(0 0 4px rgba(71, 85, 105, 0.5));
    }

    .glass-card.whitelisted .neon-curve {
      stroke: #f59e0b;
      filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.8));
    }

    .neon-node {
      fill: #ffffff;
      stroke: var(--green);
      stroke-width: 2.5;
      filter: drop-shadow(0 0 8px var(--green-glow));
      transition: all 0.4s ease;
    }

    .glass-card.disabled .neon-node {
      stroke: #475569;
      filter: none;
    }

    .glass-card.whitelisted .neon-node {
      stroke: #f59e0b;
      filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.8));
    }

    /* Main Peak Node (The Interactive Toggle Orb) */
    .peak-node-wrap {
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .peak-node-wrap:hover {
      transform: scale(1.2);
    }

    .peak-glow-halo {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.85) 0%, var(--green-glow) 40%, transparent 70%);
      top: 14px;
      left: calc(50% - 22px);
      filter: blur(4px);
      pointer-events: none;
      animation: peakPulse 3s infinite ease-in-out;
      transition: opacity 0.4s ease;
    }

    @keyframes peakPulse {
      0%, 100% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .glass-card.disabled .peak-glow-halo {
      display: none;
    }

    /* Giant Stat Section (Exact Figma Layout) */
    .stat-hero {
      text-align: center;
      position: relative;
      z-index: 2;
      margin-bottom: 8px;
    }

    .stat-kicker {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: -0.01em;
      margin-bottom: 2px;
    }

    .stat-number-giant {
      font-size: 3.25rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
    }

    .stat-subline {
      font-size: 0.6875rem;
      font-weight: 500;
      color: var(--text-dim);
      margin-top: 5px;
    }

    /* Bottom Frosted Quick Action Pills */
    .card-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      position: relative;
      z-index: 2;
    }

    .pill-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 9px 4px 8px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
      color: var(--text-muted);
      font-size: 0.625rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      outline: none;
    }

    .pill-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.28);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .pill-btn:active {
      transform: translateY(0);
    }

    .pill-btn svg {
      width: 14px;
      height: 14px;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .pill-btn:hover svg {
      transform: scale(1.15);
      color: var(--brand);
    }

    .pill-btn.active {
      background: rgba(249, 115, 22, 0.22);
      border-color: var(--brand);
      color: var(--brand);
    }

    .pill-btn.healed {
      background: rgba(16, 185, 129, 0.22);
      border-color: var(--green);
      color: var(--green);
    }

    /* Outer Footer (Figma credits style) */
    .bottom-meta {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      font-size: 0.6875rem;
      font-weight: 500;
      color: var(--text-dim);
    }

    .bottom-meta a {
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .bottom-meta a:hover {
      color: var(--brand);
    }
  </style>
</head>
<body>
  <!-- Outer Top Meta -->
  <div class="top-meta">
    <div class="brand-id">
      <img src="logo.png" alt="BYEADS" class="brand-logo-mini" />
      <span>BYEADS</span>
    </div>
    <a href="#" id="dashboardLink" class="header-link" title="Open Web Dashboard">LoopHora Shield</a>
  </div>

  <!-- Signature Ultra-Curved Glassmorphic Card -->
  <div class="glass-card" id="mainGlassCard">
    <!-- Vivid Ambient Bottom Glow (Matches App Color Gradient) -->
    <div class="card-ambient-glow" id="ambientGlow"></div>

    <!-- Card Topbar -->
    <div class="card-topbar">
      <div class="card-sync-text" id="syncStatusText">Protected &amp; Encrypted</div>
      <div class="site-filter-capsule" id="siteCapsule" title="Click to whitelist/pause this site">
        <span id="siteDomain">Active Tab</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
    </div>

    <!-- Center Glowing Neon Spline Graphic -->
    <div class="chart-section" id="toggleShieldZone" title="Click chart or peak node to toggle protection">
      <div class="peak-glow-halo" id="peakGlow"></div>
      <svg class="neon-svg" viewBox="0 0 280 130">
        <defs>
          <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="50%" stop-color="#34d399" />
            <stop offset="75%" stop-color="#f97316" />
            <stop offset="100%" stop-color="#10b981" />
          </linearGradient>
        </defs>

        <!-- Vertical Subtitle Drop Lines -->
        <line x1="45" y1="80" x2="45" y2="125" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
        <line x1="88" y1="90" x2="88" y2="125" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
        <line x1="140" y1="36" x2="140" y2="125" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="2 3" />
        <line x1="192" y1="90" x2="192" y2="125" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
        <line x1="235" y1="80" x2="235" y2="125" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

        <!-- Glowing Spline Wave Curve (Exact Figma Shape) -->
        <path class="neon-curve" id="neonCurve" d="M 15 85 C 35 85, 38 80, 50 80 C 70 80, 85 92, 105 88 C 122 84, 126 36, 140 36 C 154 36, 158 84, 175 88 C 195 92, 210 80, 230 80 C 242 80, 245 85, 265 85" />

        <!-- Interactive Data Nodes -->
        <circle class="neon-node" cx="50" cy="80" r="4.5" />
        <circle class="neon-node" cx="105" cy="88" r="4" />
        <circle class="neon-node" cx="175" cy="88" r="4" />
        <circle class="neon-node" cx="230" cy="80" r="4.5" />

        <!-- Center Glowing Peak Node (Interactive Switch Orb) -->
        <g class="peak-node-wrap" id="peakOrb">
          <circle cx="140" cy="36" r="11" fill="rgba(255,255,255,0.2)" />
          <circle cx="140" cy="36" r="8" fill="#ffffff" id="peakCore" />
        </g>
      </svg>
    </div>

    <!-- Giant Hero Number (Figma Style) -->
    <div class="stat-hero">
      <div class="stat-kicker" id="statKicker">Blocked on this page</div>
      <div class="stat-number-giant" id="siteBlockedCount">0</div>
      <div class="stat-subline" id="statSubline">100% clean &amp; ad-free browsing</div>
    </div>

    <!-- Bottom Frosted Pill Buttons -->
    <div class="card-actions">
      <button class="pill-btn" id="zapBtn" title="Point and click any element to zap it">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="22" y1="12" x2="18" y2="12"></line>
          <line x1="6" y1="12" x2="2" y2="12"></line>
          <line x1="12" y1="6" x2="12" y2="2"></line>
          <line x1="12" y1="22" x2="12" y2="18"></line>
        </svg>
        <span>Zap Element</span>
      </button>

      <button class="pill-btn" id="pauseSiteBtn" title="Pause or whitelist protection on this domain">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="4" width="4" height="16"></rect>
          <rect x="14" y="4" width="4" height="16"></rect>
        </svg>
        <span id="pauseSiteText">Pause Site</span>
      </button>

      <button class="pill-btn" id="healBtn" title="Restore broken checkouts or forms">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"></path>
        </svg>
        <span id="healText">Fix Page</span>
      </button>
    </div>
  </div>

  <!-- Outer Footer Meta (Matches Figma Anna Nazarova / Digital Designer layout) -->
  <div class="bottom-meta">
    <span id="totalBlockedText">Total: 0 blocked</span>
    <a href="#" id="openDashboardBottom">BYEADS Security</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
