<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BYEADS</title>
  <style>
    :root {
      --bg-base: #0a0e17;
      --glass-card: rgba(22, 29, 45, 0.65);
      --glass-card-hover: rgba(30, 40, 62, 0.8);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-hover: rgba(255, 255, 255, 0.16);
      --glass-shine: inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --brand: #f97316;
      --brand-glow: rgba(249, 115, 22, 0.3);
      --green: #34c759;
      --green-glow: rgba(52, 199, 89, 0.35);
      --green-subtle: rgba(52, 199, 89, 0.12);
      --amber: #f59e0b;
      --radius: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      height: 410px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, rgba(52, 199, 89, 0.12) 0%, transparent 60%),
                  radial-gradient(circle at 80% 90%, rgba(249, 115, 22, 0.08) 0%, transparent 50%),
                  var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, sans-serif;
      padding: 14px 14px 12px;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top Bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo {
      width: 24px;
      height: 24px;
      object-fit: contain;
      border-radius: 6px;
      filter: drop-shadow(0 2px 6px var(--brand-glow));
    }

    .brand-title {
      font-size: 0.9375rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      outline: none;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border-color: var(--glass-border-hover);
    }

    /* Hero Shield Section */
    .hero-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 6px 0 2px;
    }

    .shield-btn-wrap {
      position: relative;
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .shield-glow-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--green-glow) 0%, transparent 70%);
      opacity: 0.8;
      animation: pulseGlow 3s infinite ease-in-out;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(0.96); opacity: 0.5; }
      50% { transform: scale(1.08); opacity: 0.9; }
    }

    .shield-btn {
      position: relative;
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 2px solid var(--green);
      background: radial-gradient(circle at 35% 30%, rgba(52, 199, 89, 0.22) 0%, rgba(14, 20, 32, 0.95) 75%);
      box-shadow: 0 0 22px var(--green-glow),
                  inset 0 0 14px rgba(52, 199, 89, 0.2),
                  var(--glass-shine);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      outline: none;
    }

    .shield-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px var(--green-glow);
    }

    .shield-btn:active {
      transform: scale(0.96);
    }

    .shield-icon {
      width: 38px;
      height: 38px;
      color: var(--green);
      filter: drop-shadow(0 2px 8px var(--green-glow));
      transition: all 0.25s ease;
    }

    /* Paused / Disabled State */
    .hero-section.disabled .shield-glow-ring {
      display: none;
    }

    .hero-section.disabled .shield-btn {
      border-color: rgba(255, 255, 255, 0.14);
      background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.05) 0%, rgba(14, 18, 26, 0.95) 75%);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .hero-section.disabled .shield-icon {
      color: var(--text-dim);
      filter: none;
    }

    .status-title {
      font-size: 0.8125rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 4px;
      transition: color 0.25s ease;
    }

    .hero-section.disabled .status-title {
      color: var(--text-dim);
    }

    .hero-section.whitelisted .status-title {
      color: var(--amber);
    }

    .site-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--glass-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shine);
      border-radius: 9999px;
      padding: 3px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      max-width: 250px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .site-pill svg {
      width: 12px;
      height: 12px;
      color: var(--brand);
      flex-shrink: 0;
    }

    /* Clean 2-Stat Glass Row */
    .stats-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--glass-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shine), 0 4px 20px rgba(0, 0, 0, 0.25);
      border-radius: var(--radius);
      padding: 9px 12px;
    }

    .stat-col {
      display: flex;
      flex-direction: column;
    }

    .stat-col:first-child {
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      padding-right: 8px;
    }

    .stat-col:last-child {
      padding-left: 8px;
    }

    .stat-num {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: #4ade80;
    }

    .stat-num.brand {
      color: #fb923c;
    }

    .stat-desc {
      font-size: 0.625rem;
      font-weight: 600;
      color: var(--text-dim);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* 3 Action Buttons */
    .actions-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .act-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 7px 4px;
      border-radius: var(--radius-sm);
      background: var(--glass-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shine);
      color: var(--text-muted);
      font-size: 0.625rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      outline: none;
    }

    .act-btn svg {
      width: 15px;
      height: 15px;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .act-btn:hover {
      background: var(--glass-card-hover);
      border-color: var(--glass-border-hover);
      color: var(--text-main);
      transform: translateY(-1px);
    }

    .act-btn:hover svg {
      transform: scale(1.1);
      color: var(--brand);
    }

    .act-btn.active {
      background: rgba(249, 115, 22, 0.15);
      border-color: var(--brand);
      color: var(--brand);
    }

    .act-btn.healed {
      background: var(--green-subtle);
      border-color: var(--green);
      color: var(--green);
    }

    /* Simple Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 2px;
      font-size: 0.625rem;
      color: var(--text-dim);
    }

    .footer a {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: color 0.15s ease;
    }

    .footer a:hover {
      color: var(--brand);
    }
  </style>
</head>
<body>
  <!-- Header Bar -->
  <div class="topbar">
    <div class="brand-group">
      <img src="logo.png" alt="BYEADS" class="brand-logo" />
      <span class="brand-title">BYEADS</span>
    </div>
    <button class="icon-btn" id="openDashboardIcon" title="Open Dashboard">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
    </button>
  </div>

  <!-- Hero Shield Section -->
  <div class="hero-section" id="heroSection">
    <div class="shield-btn-wrap">
      <div class="shield-glow-ring"></div>
      <button class="shield-btn" id="shieldToggleBtn" title="Click to toggle protection">
        <svg class="shield-icon" id="shieldIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <path d="m9 12 2 2 4-4"></path>
        </svg>
      </button>
    </div>

    <!-- Status Text & Domain -->
    <div class="status-title" id="statusTitle">Protected</div>
    <div class="site-pill" title="Current tab domain">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
      </svg>
      <span id="siteDomain">Active Tab</span>
    </div>
  </div>

  <!-- Necessary Info: 2-Stat Glass Card -->
  <div class="stats-card">
    <div class="stat-col">
      <div class="stat-num" id="siteBlockedCount">0</div>
      <div class="stat-desc">This Page</div>
    </div>
    <div class="stat-col">
      <div class="stat-num brand" id="totalBlockedCount">0</div>
      <div class="stat-desc">Total Blocked</div>
    </div>
  </div>

  <!-- 3 Necessary Actions: Zap, Pause Site, Fix Page -->
  <div class="actions-row">
    <button class="act-btn" id="zapBtn" title="Click any element on this page to remove it">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="22" y1="12" x2="18" y2="12"></line>
        <line x1="6" y1="12" x2="2" y2="12"></line>
        <line x1="12" y1="6" x2="12" y2="2"></line>
        <line x1="12" y1="22" x2="12" y2="18"></line>
      </svg>
      <span>Block Element</span>
    </button>
    <button class="act-btn" id="pauseSiteBtn" title="Pause or whitelist protection on this domain">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="4" width="4" height="16"></rect>
        <rect x="14" y="4" width="4" height="16"></rect>
      </svg>
      <span id="pauseSiteText">Pause Site</span>
    </button>
    <button class="act-btn" id="healBtn" title="Fix page if checkout, form, or modal is broken">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"></path>
      </svg>
      <span id="healText">Fix Page</span>
    </button>
  </div>

  <!-- Minimal Footer -->
  <div class="footer">
    <a href="#" id="openDashboardLink">
      <span>Dashboard</span>
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </a>
    <span>v1.0.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
